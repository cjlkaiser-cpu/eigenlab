<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph - EigenLab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #030712;
            color: #e2e8f0;
            overflow: hidden;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(3, 7, 18, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .logo h1 { font-size: 1.1rem; font-weight: 600; }
        .logo h1 span { color: #6366f1; }
        .logo p { font-size: 0.7rem; color: #64748b; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-box { position: relative; }
        .search-box input {
            width: 200px;
            padding: 8px 12px 8px 36px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 0.8rem;
            outline: none;
            transition: all 0.2s;
        }
        .search-box input:focus { border-color: #6366f1; width: 280px; }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 0.8rem;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-ghost { background: transparent; color: #94a3b8; border-color: #334155; }
        .btn-ghost:hover { background: #1e293b; color: #e2e8f0; }

        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 260px;
            height: calc(100vh - 60px);
            background: rgba(3, 7, 18, 0.98);
            border-right: 1px solid #1e293b;
            padding: 20px;
            overflow-y: auto;
            z-index: 50;
            transition: transform 0.3s;
        }
        .sidebar.collapsed { transform: translateX(-260px); }

        .filter-section { margin-bottom: 24px; }
        .filter-title {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 8px 12px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .filter-btn:hover { background: #1e293b; color: #e2e8f0; }
        .filter-btn.active { background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
        .filter-btn .dot { width: 10px; height: 10px; border-radius: 50%; }
        .filter-btn .count { margin-left: auto; font-size: 0.7rem; color: #475569; }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }
        .stat {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: #6366f1; }
        .stat-label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; }

        #graph-container {
            position: fixed;
            top: 60px;
            left: 260px;
            right: 0;
            bottom: 0;
            background: #030712;
            transition: left 0.3s;
        }
        #graph-container.expanded { left: 0; }
        svg { width: 100%; height: 100%; }

        .node { cursor: pointer; transition: opacity 0.3s; }
        .node.has-link { cursor: pointer; }
        .node.has-link:hover circle { filter: brightness(1.3) drop-shadow(0 0 12px currentColor); }
        .node circle { stroke-width: 2px; transition: all 0.2s; }
        .node:hover circle { stroke-width: 4px; filter: brightness(1.2) drop-shadow(0 0 8px currentColor); }
        .node text { font-size: 10px; fill: #e2e8f0; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
        .node .label { font-size: 9px; fill: #94a3b8; opacity: 0; transition: opacity 0.2s; }
        .node:hover .label { opacity: 1; }
        .node .link-indicator { font-size: 8px; fill: #a5b4fc; opacity: 0; transition: opacity 0.2s; }
        .node:hover .link-indicator { opacity: 1; }

        /* Wave propagation effects */
        .node.wave-origin circle {
            animation: wave-pulse-origin 0.6s ease-out;
        }
        .node.wave-hit circle {
            animation: wave-pulse 0.5s ease-out;
        }
        .link.wave-active {
            stroke-opacity: 1 !important;
            animation: wave-link 0.4s ease-out;
        }
        @keyframes wave-pulse-origin {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.4); filter: brightness(1.8) drop-shadow(0 0 20px currentColor); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes wave-pulse {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.3); filter: brightness(1.5) drop-shadow(0 0 15px currentColor); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        @keyframes wave-link {
            0% { stroke-width: 1px; stroke-opacity: 0.4; }
            50% { stroke-width: 4px; stroke-opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
            100% { stroke-width: 1px; stroke-opacity: 0.4; }
        }

        .link { stroke: #334155; stroke-opacity: 0.4; transition: all 0.2s; }
        .link.highlighted { stroke-opacity: 1; stroke-width: 2px; }
        .link.cross-discipline { stroke-dasharray: 4 2; }

        .dimmed { opacity: 0.1; }

        .tooltip {
            position: fixed;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            max-width: 320px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 200;
        }
        .tooltip.visible { opacity: 1; }
        .tooltip-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .tooltip-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .tooltip-title { font-weight: 600; font-size: 0.95rem; }
        .tooltip-type { font-size: 0.7rem; color: #64748b; text-transform: uppercase; }
        .tooltip-desc { font-size: 0.8rem; color: #94a3b8; line-height: 1.5; }
        .tooltip-connections {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #334155;
            font-size: 0.75rem;
            color: #64748b;
        }
        .tooltip-action {
            margin-top: 10px;
            padding: 8px 12px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            border-radius: 6px;
            font-size: 0.7rem;
            color: #a5b4fc;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tooltip-action i { font-size: 0.8rem; }

        .legend {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            z-index: 50;
        }
        .legend-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 12px; }
        .legend-items { display: flex; flex-direction: column; gap: 8px; }
        .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: #94a3b8; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

        .zoom-controls {
            position: fixed;
            bottom: 20px;
            left: 280px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
            transition: left 0.3s;
        }
        .zoom-controls.expanded { left: 20px; }
        .zoom-btn {
            width: 36px;
            height: 36px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .zoom-btn:hover { background: #334155; color: #e2e8f0; }

        .toggle-sidebar {
            position: fixed;
            top: 80px;
            left: 260px;
            width: 24px;
            height: 48px;
            background: #1e293b;
            border: 1px solid #334155;
            border-left: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.3s;
            z-index: 60;
        }
        .toggle-sidebar:hover { color: #e2e8f0; }
        .toggle-sidebar.collapsed { left: 0; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-260px); }
            #graph-container { left: 0; }
            .zoom-controls { left: 20px; }
            .toggle-sidebar { left: 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon"><i class="fa-solid fa-atom"></i></div>
            <div>
                <h1><span>Eigen</span>Lab Graph</h1>
                <p>Mapa de conexiones interdisciplinarias</p>
            </div>
        </div>
        <div class="header-actions">
            <div class="search-box">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="search" placeholder="Buscar simulacion...">
            </div>
            <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-home"></i> Portal</a>
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="stat-nodes">0</div>
                <div class="stat-label">Nodos</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="stat-links">0</div>
                <div class="stat-label">Conexiones</div>
            </div>
        </div>

        <div class="filter-section">
            <div class="filter-title">Disciplinas</div>
            <button class="filter-btn active" data-filter="all">
                <span class="dot" style="background: #64748b"></span>
                Todas <span class="count" id="count-all">0</span>
            </button>
            <button class="filter-btn" data-filter="physics">
                <span class="dot" style="background: #22c55e"></span>
                Physics <span class="count" id="count-physics">0</span>
            </button>
            <button class="filter-btn" data-filter="chemistry">
                <span class="dot" style="background: #06b6d4"></span>
                Chemistry <span class="count" id="count-chemistry">0</span>
            </button>
            <button class="filter-btn" data-filter="biology">
                <span class="dot" style="background: #10b981"></span>
                Biology <span class="count" id="count-biology">0</span>
            </button>
            <button class="filter-btn" data-filter="biochemistry">
                <span class="dot" style="background: #ec4899"></span>
                Biochemistry <span class="count" id="count-biochemistry">0</span>
            </button>
            <button class="filter-btn" data-filter="geology">
                <span class="dot" style="background: #d97706"></span>
                Geology <span class="count" id="count-geology">0</span>
            </button>
            <button class="filter-btn" data-filter="astronomy">
                <span class="dot" style="background: #6366f1"></span>
                Astronomy <span class="count" id="count-astronomy">0</span>
            </button>
            <button class="filter-btn" data-filter="mathematics">
                <span class="dot" style="background: #f97316"></span>
                Mathematics <span class="count" id="count-mathematics">0</span>
            </button>
            <button class="filter-btn" data-filter="computation">
                <span class="dot" style="background: #3b82f6"></span>
                Computation <span class="count" id="count-computation">0</span>
            </button>
            <button class="filter-btn" data-filter="ai">
                <span class="dot" style="background: #8b5cf6"></span>
                AI <span class="count" id="count-ai">0</span>
            </button>
            <button class="filter-btn" data-filter="music">
                <span class="dot" style="background: #f472b6"></span>
                Music <span class="count" id="count-music">0</span>
            </button>
        </div>

        <div class="filter-section">
            <div class="filter-title">Tipo de Nodo</div>
            <button class="filter-btn" data-type="simulation">
                <i class="fa-solid fa-flask" style="width: 10px; color: #a5b4fc"></i>
                Simulaciones
            </button>
            <button class="filter-btn" data-type="concept">
                <i class="fa-solid fa-lightbulb" style="width: 10px; color: #fbbf24"></i>
                Conceptos
            </button>
            <button class="filter-btn" data-type="method">
                <i class="fa-solid fa-code" style="width: 10px; color: #34d399"></i>
                Metodos
            </button>
        </div>

        <div class="filter-section">
            <div class="filter-title">Acciones</div>
            <button class="filter-btn" onclick="resetView()">
                <i class="fa-solid fa-arrows-to-circle"></i> Centrar Vista
            </button>
            <button class="filter-btn" onclick="toggleLabels()">
                <i class="fa-solid fa-tag"></i> Toggle Labels
            </button>
            <button class="filter-btn" onclick="showCrossDiscipline()">
                <i class="fa-solid fa-link"></i> Conexiones Cross
            </button>
        </div>
    </aside>

    <button class="toggle-sidebar" id="toggle-sidebar">
        <i class="fa-solid fa-chevron-left"></i>
    </button>

    <div id="graph-container">
        <svg id="graph"></svg>
    </div>

    <div class="zoom-controls" id="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()"><i class="fa-solid fa-plus"></i></button>
        <button class="zoom-btn" onclick="zoomOut()"><i class="fa-solid fa-minus"></i></button>
        <button class="zoom-btn" onclick="resetView()"><i class="fa-solid fa-compress"></i></button>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <div class="legend">
        <div class="legend-title">Disciplinas</div>
        <div class="legend-items">
            <div class="legend-item"><span class="legend-dot" style="background: #22c55e"></span>Physics</div>
            <div class="legend-item"><span class="legend-dot" style="background: #06b6d4"></span>Chemistry</div>
            <div class="legend-item"><span class="legend-dot" style="background: #10b981"></span>Biology</div>
            <div class="legend-item"><span class="legend-dot" style="background: #ec4899"></span>Biochemistry</div>
            <div class="legend-item"><span class="legend-dot" style="background: #d97706"></span>Geology</div>
            <div class="legend-item"><span class="legend-dot" style="background: #6366f1"></span>Astronomy</div>
            <div class="legend-item"><span class="legend-dot" style="background: #f97316"></span>Mathematics</div>
            <div class="legend-item"><span class="legend-dot" style="background: #3b82f6"></span>Computation</div>
            <div class="legend-item"><span class="legend-dot" style="background: #fbbf24"></span>Conceptos</div>
        </div>
    </div>

                // Contrapunctus <-> Music cross-connections
                { source: "contrapunctus", target: "rameau-machine", cross: true },
                { source: "contrapunctus", target: "orbifold-walker", cross: true },
                { source: "contrapunctus", target: "tonnetz-atractor", cross: true },
                { source: "contrapunctus", target: "compositor-aureo", cross: true },

                // Contrapunctus <-> Computation/AI cross-connections

                { source: "contrapunctus", target: "algoritmos", cross: true },

                { source: "neurofux", target: "transformer", cross: true },
                { source: "neurofux", target: "markov-generativas", cross: true },

                // SCULPT LAB connections
                { source: "sculpt-lab", target: "fabricacion-3d" },
                { source: "sculpt-lab", target: "geometria-3d" },
                { source: "sculpt-lab", target: "platonic-solids" },

                // PUZZLE LAB connections
                { source: "puzzle-lab", target: "fabricacion-3d" },
                { source: "puzzle-lab", target: "geometria-3d" },
                { source: "puzzle-lab", target: "algoritmos" },
                { source: "puzzle-lab", target: "sculpt-lab" }
            ]
        };

        // ============================================
        // GRAPH SETUP
        // ============================================
        const container = document.getElementById('graph-container');
        const svg = d3.select('#graph');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const disciplineColors = {
            physics: '#22c55e',
            chemistry: '#06b6d4',
            biology: '#10b981',
            biochemistry: '#ec4899',
            geology: '#d97706',
            astronomy: '#6366f1',
            mathematics: '#f97316',
            computation: '#3b82f6',
            ai: '#8b5cf6',
            music: '#f472b6'
        };

        const typeColors = {
            simulation: null, // use discipline color
            concept: '#fbbf24',
            method: '#34d399'
        };

        // Calculate connections
        const linkCount = {};
        graphData.links.forEach(l => {
            linkCount[l.source] = (linkCount[l.source] || 0) + 1;
            linkCount[l.target] = (linkCount[l.target] || 0) + 1;
        });

        graphData.nodes.forEach(n => {
            n.connections = linkCount[n.id] || 0;
            n.radius = Math.max(8, Math.min(22, 6 + n.connections * 1.2));
        });

        const g = svg.append('g');

        const zoom = d3.zoom()
            .scaleExtent([0.2, 4])
            .on('zoom', (event) => g.attr('transform', event.transform));

        svg.call(zoom);

        const simulation = d3.forceSimulation(graphData.nodes)
            .force('link', d3.forceLink(graphData.links).id(d => d.id).distance(80))
            .force('charge', d3.forceManyBody().strength(-200))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(d => d.radius + 8));

        const link = g.append('g')
            .attr('class', 'links')
            .selectAll('line')
            .data(graphData.links)
            .enter()
            .append('line')
            .attr('class', d => 'link' + (d.cross ? ' cross-discipline' : ''))
            .attr('stroke', d => d.cross ? '#8b5cf6' : '#334155')
            .attr('stroke-width', d => d.cross ? 1.5 : 1);

        const node = g.append('g')
            .attr('class', 'nodes')
            .selectAll('g')
            .data(graphData.nodes)
            .enter()
            .append('g')
            .attr('class', d => 'node' + (d.url ? ' has-link' : ''))
            .call(d3.drag()
                .on('start', dragStarted)
                .on('drag', dragged)
                .on('end', dragEnded));

        node.append('circle')
            .attr('r', d => d.radius)
            .attr('fill', d => {
                if (d.type !== 'simulation') return typeColors[d.type];
                return disciplineColors[d.discipline];
            })
            .attr('stroke', d => disciplineColors[d.discipline])
            .attr('stroke-opacity', 0.6);

        node.append('text')
            .attr('class', 'icon')
            .attr('dy', 1)
            .text(d => d.label.charAt(0).toUpperCase());

        node.append('text')
            .attr('class', 'label')
            .attr('dy', d => d.radius + 14)
            .text(d => d.label);

        // Add link indicator for navigable nodes
        node.filter(d => d.url)
            .append('text')
            .attr('class', 'link-indicator')
            .attr('dx', d => d.radius - 4)
            .attr('dy', d => -d.radius + 4)
            .text('↗');

        const tooltip = document.getElementById('tooltip');

        node.on('mouseenter', (event, d) => {
            showTooltip(event, d);
            highlightConnections(d);
        })
        .on('mouseleave', () => {
            hideTooltip();
            resetHighlight();
        })
        .on('click', (event, d) => {
            // Alt+Click: propagate wave without navigation
            if (event.altKey) {
                event.preventDefault();
                propagateWave(d);
                return;
            }

            if (d.url) {
                // Ctrl/Cmd + click opens in new tab
                if (event.ctrlKey || event.metaKey) {
                    window.open(d.url, '_blank');
                } else {
                    window.location.href = d.url;
                }
            } else {
                // Concept/method nodes: propagate wave and focus
                propagateWave(d);
                focusNode(d);
            }
        })
        .on('dblclick', (event, d) => {
            if (d.url) {
                window.open(d.url, '_blank');
            }
        });

        simulation.on('tick', () => {
            link
                .attr('x1', d => d.source.x)
                .attr('y1', d => d.source.y)
                .attr('x2', d => d.target.x)
                .attr('y2', d => d.target.y);
            node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        // ============================================
        // INTERACTIONS
        // ============================================
        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x; d.fy = d.y;
        }
        function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null; d.fy = null;
        }

        function showTooltip(event, d) {
            const connectedNodes = graphData.links
                .filter(l => l.source.id === d.id || l.target.id === d.id)
                .map(l => l.source.id === d.id ? l.target.label : l.source.label);

            const color = d.type === 'simulation' ? disciplineColors[d.discipline] : typeColors[d.type];

            const actionHtml = d.url ? `
                <div class="tooltip-action">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    Click abrir · Ctrl+Click nueva pestaña
                </div>
            ` : `
                <div class="tooltip-action">
                    <i class="fa-solid fa-wave-square"></i>
                    Click para propagar onda
                </div>
            `;

            tooltip.innerHTML = `
                <div class="tooltip-header">
                    <div class="tooltip-icon" style="background: ${color}30; color: ${color}">
                        <i class="fa-solid fa-${d.type === 'simulation' ? 'flask' : d.type === 'concept' ? 'lightbulb' : 'code'}"></i>
                    </div>
                    <div>
                        <div class="tooltip-title">${d.label}</div>
                        <div class="tooltip-type">${d.discipline} · ${d.type}</div>
                    </div>
                </div>
                <div class="tooltip-desc">${d.desc || ''}</div>
                <div class="tooltip-connections">
                    <strong>${d.connections}</strong> conexiones: ${connectedNodes.slice(0, 5).join(', ')}${connectedNodes.length > 5 ? '...' : ''}
                </div>
                ${actionHtml}
            `;
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
            tooltip.classList.add('visible');
        }

        function hideTooltip() { tooltip.classList.remove('visible'); }

        // Wave propagation function
        function propagateWave(startNode) {
            // Build adjacency map
            const adjacency = new Map();
            graphData.nodes.forEach(n => adjacency.set(n.id, []));
            graphData.links.forEach(l => {
                const sourceId = typeof l.source === 'object' ? l.source.id : l.source;
                const targetId = typeof l.target === 'object' ? l.target.id : l.target;
                adjacency.get(sourceId).push(targetId);
                adjacency.get(targetId).push(sourceId);
            });

            // BFS to get nodes by distance
            const visited = new Set([startNode.id]);
            const levels = [[startNode.id]];
            let currentLevel = [startNode.id];

            while (currentLevel.length > 0 && levels.length < 6) {
                const nextLevel = [];
                currentLevel.forEach(nodeId => {
                    adjacency.get(nodeId).forEach(neighborId => {
                        if (!visited.has(neighborId)) {
                            visited.add(neighborId);
                            nextLevel.push(neighborId);
                        }
                    });
                });
                if (nextLevel.length > 0) {
                    levels.push(nextLevel);
                }
                currentLevel = nextLevel;
            }

            // Animate origin node
            node.filter(n => n.id === startNode.id)
                .classed('wave-origin', true);

            // Animate each level with delay
            levels.forEach((levelNodes, levelIndex) => {
                if (levelIndex === 0) return; // Skip origin

                const delay = levelIndex * 150;
                const fadeDelay = delay + 500;

                setTimeout(() => {
                    // Animate nodes at this level
                    node.filter(n => levelNodes.includes(n.id))
                        .classed('wave-hit', true);

                    // Animate links connecting to this level
                    link.filter(l => {
                        const sourceId = typeof l.source === 'object' ? l.source.id : l.source;
                        const targetId = typeof l.target === 'object' ? l.target.id : l.target;
                        const prevLevelNodes = levels[levelIndex - 1];
                        return (levelNodes.includes(sourceId) && prevLevelNodes.includes(targetId)) ||
                               (levelNodes.includes(targetId) && prevLevelNodes.includes(sourceId));
                    }).classed('wave-active', true);
                }, delay);

                // Remove classes after animation
                setTimeout(() => {
                    node.filter(n => levelNodes.includes(n.id))
                        .classed('wave-hit', false);
                    link.classed('wave-active', false);
                }, fadeDelay);
            });

            // Clean up origin
            setTimeout(() => {
                node.classed('wave-origin', false);
            }, 600);
        }

        function highlightConnections(d) {
            const connectedIds = new Set([d.id]);
            graphData.links.forEach(l => {
                if (l.source.id === d.id) connectedIds.add(l.target.id);
                if (l.target.id === d.id) connectedIds.add(l.source.id);
            });
            node.classed('dimmed', n => !connectedIds.has(n.id));
            link.classed('dimmed', l => l.source.id !== d.id && l.target.id !== d.id);
            link.classed('highlighted', l => l.source.id === d.id || l.target.id === d.id);
        }

        function resetHighlight() {
            node.classed('dimmed', false);
            link.classed('dimmed', false);
            link.classed('highlighted', false);
        }

        function focusNode(d) {
            const transform = d3.zoomIdentity
                .translate(width / 2, height / 2)
                .scale(1.5)
                .translate(-d.x, -d.y);
            svg.transition().duration(750).call(zoom.transform, transform);
        }

        // ============================================
        // CONTROLS
        // ============================================
        function zoomIn() { svg.transition().duration(300).call(zoom.scaleBy, 1.3); }
        function zoomOut() { svg.transition().duration(300).call(zoom.scaleBy, 0.7); }
        function resetView() {
            svg.transition().duration(750).call(
                zoom.transform,
                d3.zoomIdentity.translate(width / 2, height / 2).scale(0.7).translate(-width / 2, -height / 2)
            );
        }

        let labelsVisible = false;
        function toggleLabels() {
            labelsVisible = !labelsVisible;
            node.selectAll('.label').style('opacity', labelsVisible ? 1 : 0);
        }

        function showCrossDiscipline() {
            const crossLinks = graphData.links.filter(l => l.cross);
            const involvedIds = new Set();
            crossLinks.forEach(l => {
                involvedIds.add(l.source.id);
                involvedIds.add(l.target.id);
            });
            node.style('opacity', d => involvedIds.has(d.id) ? 1 : 0.1);
            link.style('opacity', l => l.cross ? 1 : 0.05);
        }

        function randomWave() {
            // Pick a random node with connections
            const nodesWithConnections = graphData.nodes.filter(n => n.connections > 2);
            const randomNode = nodesWithConnections[Math.floor(Math.random() * nodesWithConnections.length)];
            propagateWave(randomNode);
            focusNode(randomNode);
        }

        // ============================================
        // FILTERS
        // ============================================
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    node.style('opacity', 1);
                    link.style('opacity', 1);
                } else {
                    node.style('opacity', d => d.discipline === filter ? 1 : 0.1);
                    link.style('opacity', l =>
                        (l.source.discipline === filter || l.target.discipline === filter) ? 0.6 : 0.05
                    );
                }
            });
        });

        document.querySelectorAll('.filter-btn[data-type]').forEach(btn => {
            btn.addEventListener('click', () => {
                const type = btn.dataset.type;
                node.style('opacity', d => d.type === type ? 1 : 0.1);
                link.style('opacity', 0.1);
            });
        });

        document.getElementById('search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            if (!query) {
                node.style('opacity', 1);
                link.style('opacity', 1);
                return;
            }
            const matchingIds = new Set();
            graphData.nodes.forEach(n => {
                if (n.label.toLowerCase().includes(query) || (n.desc && n.desc.toLowerCase().includes(query))) {
                    matchingIds.add(n.id);
                }
            });
            node.style('opacity', d => matchingIds.has(d.id) ? 1 : 0.1);
            link.style('opacity', 0.1);
            if (matchingIds.size > 0) {
                const firstMatch = graphData.nodes.find(n => matchingIds.has(n.id));
                if (firstMatch && firstMatch.x) focusNode(firstMatch);
            }
        });

        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            const sidebar = document.getElementById('sidebar');
            const graphContainer = document.getElementById('graph-container');
            const zoomControls = document.getElementById('zoom-controls');
            const toggleBtn = document.getElementById('toggle-sidebar');
            sidebar.classList.toggle('collapsed');
            graphContainer.classList.toggle('expanded');
            zoomControls.classList.toggle('expanded');
            toggleBtn.classList.toggle('collapsed');
            const icon = toggleBtn.querySelector('i');
            icon.classList.toggle('fa-chevron-left');
            icon.classList.toggle('fa-chevron-right');
        });

        // ============================================
        // STATS
        // ============================================
        function updateStats() {
            document.getElementById('stat-nodes').textContent = graphData.nodes.length;
            document.getElementById('stat-links').textContent = graphData.links.length;

            const counts = { all: graphData.nodes.length };
            graphData.nodes.forEach(n => {
                counts[n.discipline] = (counts[n.discipline] || 0) + 1;
            });

            document.getElementById('count-all').textContent = counts.all;
            Object.keys(disciplineColors).forEach(d => {
                const el = document.getElementById('count-' + d);
                if (el) el.textContent = counts[d] || 0;
            });
        }
        updateStats();

        setTimeout(() => resetView(), 500);

        window.addEventListener('resize', () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            simulation.force('center', d3.forceCenter(newWidth / 2, newHeight / 2));
            simulation.alpha(0.3).restart();
        });
    </script>
