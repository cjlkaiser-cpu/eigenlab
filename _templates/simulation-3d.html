<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[TÍTULO] - EigenLab</title>
    <style>
        /* ========================================
           EigenLab - Plantilla Simulación 3D
           ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #030712;
            --bg-secondary: #0f172a;
            --bg-panel: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #06b6d4;
            --accent-glow: rgba(6, 182, 212, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header .breadcrumb {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .header .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
        }

        .main {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }

        .canvas-container {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            width: 320px;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .slider-group label span {
            color: var(--accent);
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-panel);
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        select {
            width: 100%;
            padding: 0.5rem;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        button {
            flex: 1;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--bg-panel);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        button:hover {
            background: var(--border);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .info-box {
            background: var(--bg-panel);
            border-radius: 0.375rem;
            padding: 0.75rem;
            font-size: 0.8125rem;
            line-height: 1.5;
        }

        .info-box .title {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-style: italic;
        }

        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .controls {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>[TÍTULO DE LA SIMULACIÓN 3D]</h1>
        <nav class="breadcrumb">
            <a href="../../_portal/index.html">EigenLab</a> /
            <a href="../index.html">[Disciplina] Visual Lab</a>
        </nav>
    </header>

    <main class="main">
        <div class="canvas-container">
            <canvas id="canvas-3d"></canvas>
        </div>

        <aside class="controls">
            <!-- Selector de modelo -->
            <div class="control-section">
                <h3>Modelo</h3>
                <select id="model-select">
                    <option value="model1">Modelo 1</option>
                    <option value="model2">Modelo 2</option>
                    <option value="model3">Modelo 3</option>
                </select>
            </div>

            <!-- Parámetros -->
            <div class="control-section">
                <h3>Parámetros</h3>

                <div class="slider-group">
                    <label>
                        Escala
                        <span id="scale-value">1.0</span>
                    </label>
                    <input type="range" id="scale" min="0.5" max="2" step="0.1" value="1">
                </div>

                <div class="slider-group">
                    <label>
                        Rotación Auto
                        <span id="rotation-value">1.0</span>
                    </label>
                    <input type="range" id="rotation" min="0" max="3" step="0.1" value="1">
                </div>
            </div>

            <!-- Controles de cámara -->
            <div class="control-section">
                <h3>Cámara</h3>
                <div class="button-group">
                    <button id="btn-reset-camera">Reset Vista</button>
                </div>
                <p class="hint">Arrastra para rotar, scroll para zoom</p>
            </div>

            <!-- Información -->
            <div class="control-section">
                <h3>Información</h3>
                <div class="info-box">
                    <div class="title" id="info-title">Modelo 1</div>
                    <div id="info-description">
                        Descripción del modelo seleccionado.
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Three.js desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        /* ========================================
           EigenLab - Plantilla Simulación 3D
           ======================================== */

        // === CONFIGURACIÓN ===
        const CONFIG = {
            scale: 1.0,
            rotationSpeed: 1.0,
            currentModel: 'model1',
        };

        // === THREE.JS SETUP ===
        const container = document.querySelector('.canvas-container');
        const canvas = document.getElementById('canvas-3d');

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x030712);

        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            container.clientWidth / container.clientHeight,
            0.1,
            1000
        );
        camera.position.set(0, 0, 5);

        // Controls
        const controls = new THREE.OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2;
        controls.maxDistance = 20;

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        // === MODELOS ===
        let currentMesh = null;

        const MODELS = {
            model1: {
                name: 'Cubo',
                description: 'Geometría básica: cubo con aristas suavizadas.',
                create: () => {
                    const geometry = new THREE.BoxGeometry(2, 2, 2);
                    const material = new THREE.MeshPhongMaterial({
                        color: 0x06b6d4,
                        shininess: 100
                    });
                    return new THREE.Mesh(geometry, material);
                }
            },
            model2: {
                name: 'Esfera',
                description: 'Esfera con segmentos de alta resolución.',
                create: () => {
                    const geometry = new THREE.SphereGeometry(1.5, 64, 64);
                    const material = new THREE.MeshPhongMaterial({
                        color: 0x22c55e,
                        shininess: 100
                    });
                    return new THREE.Mesh(geometry, material);
                }
            },
            model3: {
                name: 'Torus',
                description: 'Toro (donut) con geometría paramétrica.',
                create: () => {
                    const geometry = new THREE.TorusGeometry(1, 0.4, 32, 100);
                    const material = new THREE.MeshPhongMaterial({
                        color: 0xa855f7,
                        shininess: 100
                    });
                    return new THREE.Mesh(geometry, material);
                }
            }
        };

        function loadModel(modelKey) {
            // Remover modelo anterior
            if (currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            // Crear nuevo modelo
            const modelData = MODELS[modelKey];
            currentMesh = modelData.create();
            currentMesh.scale.setScalar(CONFIG.scale);
            scene.add(currentMesh);

            // Actualizar info
            document.getElementById('info-title').textContent = modelData.name;
            document.getElementById('info-description').textContent = modelData.description;

            CONFIG.currentModel = modelKey;
        }

        // === CONTROLES UI ===
        document.getElementById('model-select').addEventListener('change', (e) => {
            loadModel(e.target.value);
        });

        document.getElementById('scale').addEventListener('input', (e) => {
            CONFIG.scale = parseFloat(e.target.value);
            document.getElementById('scale-value').textContent = CONFIG.scale.toFixed(1);
            if (currentMesh) {
                currentMesh.scale.setScalar(CONFIG.scale);
            }
        });

        document.getElementById('rotation').addEventListener('input', (e) => {
            CONFIG.rotationSpeed = parseFloat(e.target.value);
            document.getElementById('rotation-value').textContent = CONFIG.rotationSpeed.toFixed(1);
        });

        document.getElementById('btn-reset-camera').addEventListener('click', () => {
            camera.position.set(0, 0, 5);
            controls.reset();
        });

        // === RESIZE ===
        function onResize() {
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();

            renderer.setSize(width, height);
        }

        window.addEventListener('resize', onResize);
        onResize();

        // === ANIMATION LOOP ===
        function animate() {
            requestAnimationFrame(animate);

            // Rotación automática
            if (currentMesh && CONFIG.rotationSpeed > 0) {
                currentMesh.rotation.y += 0.01 * CONFIG.rotationSpeed;
                currentMesh.rotation.x += 0.005 * CONFIG.rotationSpeed;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // === INICIAR ===
        loadModel('model1');
        animate();
    </script>
</body>
</html>
