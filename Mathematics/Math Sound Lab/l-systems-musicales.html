<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-Systems Musicales - EigenLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ========================================
           L-Systems Musicales - Math Sound Lab
           ======================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #030712;
            --bg-secondary: #0f172a;
            --bg-panel: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #334155;
            --accent: #f97316;
            --accent-glow: rgba(249, 115, 22, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .header .breadcrumb {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .header .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
        }

        .main {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
        }

        .canvas-container {
            flex: 1;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            width: 340px;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
        }

        .equation {
            font-family: 'Times New Roman', serif;
            font-style: italic;
            font-size: 1rem;
            text-align: center;
            padding: 1rem;
            background: var(--bg-panel);
            border-radius: 0.375rem;
            border: 1px solid var(--border);
            line-height: 1.6;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
        }

        .slider-group label span {
            color: var(--accent);
            font-family: 'SF Mono', 'Consolas', monospace;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-panel);
            appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
            border: none;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
        }

        button {
            flex: 1;
            padding: 0.625rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            background: var(--bg-panel);
            color: var(--text-primary);
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        button:hover {
            background: var(--border);
        }

        button.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        button.primary:hover {
            filter: brightness(1.1);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select, textarea, input[type="text"] {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--text-primary);
            font-size: 0.875rem;
            font-family: inherit;
        }

        textarea {
            font-family: 'SF Mono', 'Consolas', monospace;
            resize: vertical;
            min-height: 80px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--accent);
        }

        .values {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .value-item {
            background: var(--bg-panel);
            padding: 0.5rem 0.75rem;
            border-radius: 0.25rem;
            font-size: 0.8125rem;
        }

        .value-item .label {
            color: var(--text-secondary);
            font-size: 0.75rem;
        }

        .value-item .number {
            font-family: 'SF Mono', 'Consolas', monospace;
            color: var(--accent);
        }

        .preset-description {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            padding: 0.5rem 0.75rem;
            background: var(--bg-panel);
            border-radius: 0.25rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }
            .controls {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>L-Systems Musicales</h1>
        <nav class="breadcrumb">
            <a href="../../_portal/index.html">EigenLab</a> /
            <a href="../index.html">Math Sound Lab</a>
        </nav>
    </header>

    <main class="main">
        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <aside class="controls">
            <!-- Math Box -->
            <div class="control-section">
                <div class="equation">
                    axiom → rules<sup>n</sup><br>
                    <span style="font-size: 0.85rem; font-style: normal; color: var(--text-secondary);">
                        Gramáticas generativas de Lindenmayer
                    </span>
                </div>
            </div>

            <!-- Presets -->
            <div class="control-section">
                <h3>Presets</h3>
                <select id="preset-select">
                    <option value="binaryTree">Árbol Binario</option>
                    <option value="fractalPlant">Planta Fractal</option>
                    <option value="fern">Helecho</option>
                    <option value="seaweed">Alga</option>
                    <option value="bush">Arbusto</option>
                    <option value="sierpinski">Triángulo de Sierpinski</option>
                </select>
                <button id="btn-load-preset">Cargar Preset</button>
                <div class="preset-description" id="preset-description">
                    Ramificación binaria simple
                </div>
            </div>

            <!-- Configuración L-System -->
            <div class="control-section">
                <h3>Configuración</h3>

                <div class="slider-group">
                    <label>
                        Iteraciones
                        <span id="iterations-value">4</span>
                    </label>
                    <input type="range" id="iterations" min="1" max="7" value="4">
                </div>

                <div class="slider-group">
                    <label>
                        Ángulo
                        <span id="angle-value">25.7°</span>
                    </label>
                    <input type="range" id="angle" min="15" max="90" value="25.7" step="0.1">
                </div>

                <label style="font-size: 0.875rem; margin-top: 0.5rem;">Axioma</label>
                <input type="text" id="axiom" value="F">

                <label style="font-size: 0.875rem; margin-top: 0.5rem;">
                    Reglas (formato: F=F[+F]F[-F]F)
                </label>
                <textarea id="rules" placeholder="F=F[+F]F[-F]F&#10;X=F+X"></textarea>
            </div>

            <!-- Visualización -->
            <div class="control-section">
                <h3>Visualización</h3>

                <div class="checkbox-group">
                    <input type="checkbox" id="gradient-colors" checked>
                    <label for="gradient-colors" style="margin: 0;">Gradiente de color</label>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="taper-width" checked>
                    <label for="taper-width" style="margin: 0;">Grosor decreciente</label>
                </div>

                <div class="slider-group">
                    <label>
                        Grosor base
                        <span id="stroke-width-value">2.5</span>
                    </label>
                    <input type="range" id="stroke-width" min="0.5" max="5" value="2.5" step="0.1">
                </div>
            </div>

            <!-- Audio Settings -->
            <div class="control-section">
                <h3>Audio</h3>

                <div class="checkbox-group">
                    <input type="checkbox" id="audio-enabled" checked>
                    <label for="audio-enabled" style="margin: 0;">Activar audio</label>
                </div>

                <div class="slider-group">
                    <label>
                        Volumen
                        <span id="volume-value">0.3</span>
                    </label>
                    <input type="range" id="volume" min="0" max="1" value="0.3" step="0.05">
                </div>

                <label style="font-size: 0.875rem; margin-top: 0.5rem;">Escala</label>
                <select id="scale">
                    <option value="pentatonic-minor">Pentatónica Menor</option>
                    <option value="pentatonic-major">Pentatónica Mayor</option>
                </select>

                <label style="font-size: 0.875rem; margin-top: 0.5rem;">Forma de onda</label>
                <select id="waveform">
                    <option value="sine">Sine</option>
                    <option value="triangle">Triangle</option>
                    <option value="square">Square</option>
                    <option value="sawtooth">Sawtooth</option>
                </select>
            </div>

            <!-- Reproducción -->
            <div class="control-section">
                <h3>Reproducción</h3>

                <button id="btn-generate">Generar</button>

                <div class="button-group">
                    <button id="btn-play" class="primary">Reproducir</button>
                    <button id="btn-stop">Detener</button>
                </div>

                <div class="slider-group">
                    <label>
                        BPM
                        <span id="bpm-value">120</span>
                    </label>
                    <input type="range" id="bpm" min="30" max="240" value="120">
                </div>
            </div>

            <!-- Estadísticas -->
            <div class="control-section">
                <h3>Estadísticas</h3>
                <div class="values">
                    <div class="value-item">
                        <div class="label">Longitud string</div>
                        <div class="number" id="string-length">0</div>
                    </div>
                    <div class="value-item">
                        <div class="label">Segmentos</div>
                        <div class="number" id="num-segments">0</div>
                    </div>
                    <div class="value-item">
                        <div class="label">Prof. máxima</div>
                        <div class="number" id="max-depth">0</div>
                    </div>
                    <div class="value-item">
                        <div class="label">Duración</div>
                        <div class="number" id="total-duration">0.0s</div>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        /* ========================================
           L-Systems Musicales - Implementation
           ======================================== */

        // === PRESETS ===
        const lSystemPresets = {
            binaryTree: {
                name: "Árbol Binario",
                axiom: "F",
                rules: { F: "F[+F]F[-F]F" },
                angle: 25.7,
                iterations: 4,
                description: "Ramificación binaria simple"
            },
            fractalPlant: {
                name: "Planta Fractal",
                axiom: "X",
                rules: {
                    X: "F+[[X]-X]-F[-FX]+X",
                    F: "FF"
                },
                angle: 25,
                iterations: 5,
                description: "Patrón vegetal complejo"
            },
            fern: {
                name: "Helecho",
                axiom: "X",
                rules: {
                    X: "F[+X]F[-X]+X",
                    F: "FF"
                },
                angle: 20,
                iterations: 6,
                description: "Helecho orgánico"
            },
            seaweed: {
                name: "Alga",
                axiom: "F",
                rules: { F: "FF+[+F-F-F]-[-F+F+F]" },
                angle: 22.5,
                iterations: 4,
                description: "Patrón simétrico de alga"
            },
            bush: {
                name: "Arbusto",
                axiom: "F",
                rules: { F: "FF-[-F+F+F]+[+F-F-F]" },
                angle: 22.5,
                iterations: 4,
                description: "Arbusto caótico"
            },
            sierpinski: {
                name: "Triángulo de Sierpinski",
                axiom: "F-G-G",
                rules: {
                    F: "F-G+F+G-F",
                    G: "GG"
                },
                angle: 120,
                iterations: 5,
                description: "Fractal geométrico clásico"
            }
        };

        // === CONFIG ===
        const CONFIG = {
            audioEnabled: true,
            volume: 0.3,
            bpm: 120,
            scale: 'pentatonic-minor',
            waveform: 'sine',
            gradientColors: true,
            taperWidth: true,
            strokeWidth: 2.5
        };

        // === LSYSTEM CLASS ===
        class LSystem {
            constructor(axiom, rules, angle) {
                this.axiom = axiom;
                this.rules = rules;
                this.angle = angle;
                this.string = axiom;
                this.iterations = 0;
            }

            expand(iterations) {
                let current = this.axiom;
                for (let i = 0; i < iterations; i++) {
                    let next = '';
                    for (const char of current) {
                        next += this.rules[char] || char;
                    }
                    current = next;
                    // Safety limit
                    if (current.length > 100000) {
                        console.warn('String length exceeded 100,000 characters. Stopping expansion.');
                        break;
                    }
                }
                this.string = current;
                this.iterations = iterations;
                return current;
            }

            calculateBounds() {
                let x = 0, y = 0;
                let angle = -90;
                let minX = 0, maxX = 0, minY = 0, maxY = 0;
                const stack = [];
                const length = 10;

                for (const char of this.string) {
                    const rad = angle * Math.PI / 180;

                    switch (char) {
                        case 'F':
                        case 'G':
                            x += Math.cos(rad) * length;
                            y += Math.sin(rad) * length;
                            minX = Math.min(minX, x);
                            maxX = Math.max(maxX, x);
                            minY = Math.min(minY, y);
                            maxY = Math.max(maxY, y);
                            break;
                        case '+':
                            angle += this.angle;
                            break;
                        case '-':
                            angle -= this.angle;
                            break;
                        case '[':
                            stack.push({ x, y, angle });
                            break;
                        case ']':
                            if (stack.length > 0) {
                                const state = stack.pop();
                                x = state.x;
                                y = state.y;
                                angle = state.angle;
                            }
                            break;
                    }
                }

                return {
                    minX,
                    maxX,
                    minY,
                    maxY,
                    width: maxX - minX,
                    height: maxY - minY
                };
            }

            generateSegments(canvasWidth, canvasHeight) {
                // 1. Calculate bounds first
                const bounds = this.calculateBounds();

                // 2. Auto-scale
                const padding = 60;
                const scale = Math.min(
                    (canvasWidth - padding * 2) / Math.max(bounds.width, 1),
                    (canvasHeight - padding * 2) / Math.max(bounds.height, 1)
                );

                // 3. Center
                const offsetX = padding + (canvasWidth - padding * 2 - bounds.width * scale) / 2 - bounds.minX * scale;
                const offsetY = padding + (canvasHeight - padding * 2 - bounds.height * scale) / 2 - bounds.minY * scale;

                // 4. Generate segments with stack
                const segments = [];
                let x = offsetX;
                let y = offsetY;
                let angle = -90;
                const stack = [];
                let depth = 0;
                let maxDepth = 0;
                const length = 10 * scale;

                for (const char of this.string) {
                    const rad = angle * Math.PI / 180;

                    switch (char) {
                        case 'F':
                        case 'G':
                            const nx = x + Math.cos(rad) * length;
                            const ny = y + Math.sin(rad) * length;
                            segments.push({ x1: x, y1: y, x2: nx, y2: ny, depth });
                            x = nx;
                            y = ny;
                            break;
                        case '+':
                            angle += this.angle;
                            break;
                        case '-':
                            angle -= this.angle;
                            break;
                        case '[':
                            stack.push({ x, y, angle, depth });
                            depth++;
                            maxDepth = Math.max(maxDepth, depth);
                            break;
                        case ']':
                            if (stack.length > 0) {
                                const state = stack.pop();
                                x = state.x;
                                y = state.y;
                                angle = state.angle;
                                depth = state.depth;
                            }
                            break;
                    }
                }

                // 5. Normalize depth for colors
                segments.forEach(seg => {
                    seg.normalizedDepth = maxDepth > 0 ? seg.depth / maxDepth : 0;
                });

                return { segments, maxDepth };
            }

            generateAudioEvents() {
                const events = [];
                const noteDuration = 60 / CONFIG.bpm;
                let currentTime = 0;
                let currentPitch = 60;
                const pitchStack = [];
                let depth = 0;

                const scales = {
                    'pentatonic-minor': [0, 3, 5, 7, 10],
                    'pentatonic-major': [0, 2, 4, 7, 9]
                };
                const scale = scales[CONFIG.scale];

                for (const char of this.string) {
                    switch (char) {
                        case 'F':
                        case 'G':
                            const octaveOffset = Math.floor(depth / 2) * 12;
                            const scaleNote = scale[depth % scale.length];
                            const midiNote = 60 + octaveOffset + scaleNote;

                            events.push({
                                type: 'note',
                                midiNote: midiNote,
                                time: currentTime,
                                duration: noteDuration * 0.8,
                                depth: depth
                            });

                            currentTime += noteDuration;
                            break;

                        case '+':
                            currentPitch += 2;
                            break;

                        case '-':
                            currentPitch -= 2;
                            break;

                        case '[':
                            pitchStack.push(currentPitch);
                            depth++;
                            currentPitch += 5;
                            break;

                        case ']':
                            if (pitchStack.length > 0) {
                                currentPitch = pitchStack.pop();
                            }
                            depth--;
                            break;
                    }
                }

                return events;
            }
        }

        // === CANVAS SETUP ===
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let dpr = window.devicePixelRatio || 1;

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            ctx.scale(dpr, dpr);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // === STATE ===
        let lSystem = null;
        let segments = [];
        let audioEvents = [];
        let animationSegmentIndex = 0;
        let audioEventIndex = 0;
        let isPlaying = false;
        let startTime = 0;
        let animationId = null;

        // === AUDIO ===
        let audioContext = null;
        let masterGain = null;
        let isAudioInitialized = false;

        function initAudioContext() {
            if (isAudioInitialized) return;
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioContext.createGain();
            masterGain.connect(audioContext.destination);
            masterGain.gain.value = CONFIG.volume;
            isAudioInitialized = true;
        }

        function playNote(midiNote, durationMs) {
            if (!isAudioInitialized || !CONFIG.audioEnabled) return;

            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
            const duration = durationMs / 1000;
            const now = audioContext.currentTime;

            const osc = audioContext.createOscillator();
            osc.type = CONFIG.waveform;
            osc.frequency.value = frequency;

            const envelope = audioContext.createGain();
            envelope.gain.setValueAtTime(0, now);
            envelope.gain.linearRampToValueAtTime(CONFIG.volume * 0.3, now + 0.01);
            envelope.gain.exponentialRampToValueAtTime(0.001, now + duration);

            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = frequency * 3;
            filter.Q.value = 1;

            osc.connect(filter);
            filter.connect(envelope);
            envelope.connect(masterGain);

            osc.start(now);
            osc.stop(now + duration + 0.1);
        }

        // === GENERATION ===
        function generateLSystem() {
            const axiom = document.getElementById('axiom').value.trim();
            const rulesText = document.getElementById('rules').value.trim();
            const angle = parseFloat(document.getElementById('angle').value);
            const iterations = parseInt(document.getElementById('iterations').value);

            // Parse rules
            const rules = {};
            if (rulesText) {
                const lines = rulesText.split('\n');
                for (const line of lines) {
                    const parts = line.split('=');
                    if (parts.length === 2) {
                        const key = parts[0].trim();
                        const value = parts[1].trim();
                        rules[key] = value;
                    }
                }
            }

            lSystem = new LSystem(axiom, rules, angle);
            lSystem.expand(iterations);

            const w = canvas.width / dpr;
            const h = canvas.height / dpr;

            const result = lSystem.generateSegments(w, h);
            segments = result.segments;

            audioEvents = lSystem.generateAudioEvents();

            updateStats();
            drawTree();
        }

        function updateStats() {
            document.getElementById('string-length').textContent = lSystem.string.length.toLocaleString();
            document.getElementById('num-segments').textContent = segments.length.toLocaleString();

            const maxDepth = segments.length > 0
                ? Math.max(...segments.map(s => s.depth))
                : 0;
            document.getElementById('max-depth').textContent = maxDepth;

            const totalDuration = audioEvents.length > 0
                ? audioEvents[audioEvents.length - 1].time + audioEvents[audioEvents.length - 1].duration
                : 0;
            document.getElementById('total-duration').textContent = totalDuration.toFixed(1) + 's';
        }

        // === DRAWING ===
        function drawTree() {
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;

            ctx.fillStyle = '#030712';
            ctx.fillRect(0, 0, w, h);

            const segmentsToDraw = isPlaying ? animationSegmentIndex : segments.length;

            for (let i = 0; i < segmentsToDraw; i++) {
                const seg = segments[i];

                if (CONFIG.gradientColors) {
                    const hue = 120 - seg.normalizedDepth * 90;
                    const lightness = 50 - seg.normalizedDepth * 20;
                    ctx.strokeStyle = `hsl(${hue}, 70%, ${lightness}%)`;
                } else {
                    ctx.strokeStyle = '#f97316';
                }

                if (CONFIG.taperWidth) {
                    ctx.lineWidth = CONFIG.strokeWidth * (1 - seg.normalizedDepth * 0.7);
                } else {
                    ctx.lineWidth = CONFIG.strokeWidth;
                }

                ctx.lineCap = 'round';

                ctx.beginPath();
                ctx.moveTo(seg.x1, seg.y1);
                ctx.lineTo(seg.x2, seg.y2);
                ctx.stroke();
            }
        }

        // === PLAYBACK ===
        function playLoop(timestamp) {
            if (!isPlaying) return;

            if (startTime === 0) startTime = timestamp;
            const elapsed = (timestamp - startTime) / 1000;

            while (audioEventIndex < audioEvents.length) {
                const event = audioEvents[audioEventIndex];
                if (event.time <= elapsed) {
                    playNote(event.midiNote, event.duration * 1000);
                    audioEventIndex++;
                } else {
                    break;
                }
            }

            const totalDuration = audioEvents.length > 0
                ? audioEvents[audioEvents.length - 1].time + audioEvents[audioEvents.length - 1].duration
                : 1;
            const progress = Math.min(elapsed / totalDuration, 1);
            animationSegmentIndex = Math.floor(progress * segments.length);

            drawTree();

            if (audioEventIndex < audioEvents.length || animationSegmentIndex < segments.length) {
                animationId = requestAnimationFrame(playLoop);
            } else {
                stopPlayback();
            }
        }

        function startPlayback() {
            if (segments.length === 0) {
                generateLSystem();
            }

            if (audioEvents.length === 0) return;

            initAudioContext();

            isPlaying = true;
            startTime = 0;
            audioEventIndex = 0;
            animationSegmentIndex = 0;

            document.getElementById('btn-play').textContent = 'Pausar';

            animationId = requestAnimationFrame(playLoop);
        }

        function pausePlayback() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            document.getElementById('btn-play').textContent = 'Reproducir';
        }

        function stopPlayback() {
            isPlaying = false;
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            startTime = 0;
            audioEventIndex = 0;
            animationSegmentIndex = segments.length;

            document.getElementById('btn-play').textContent = 'Reproducir';
            drawTree();
        }

        // === CONTROLS ===
        const presetSelect = document.getElementById('preset-select');
        const btnLoadPreset = document.getElementById('btn-load-preset');
        const sliderIterations = document.getElementById('iterations');
        const sliderAngle = document.getElementById('angle');
        const sliderStrokeWidth = document.getElementById('stroke-width');
        const sliderVolume = document.getElementById('volume');
        const sliderBpm = document.getElementById('bpm');
        const btnGenerate = document.getElementById('btn-generate');
        const btnPlay = document.getElementById('btn-play');
        const btnStop = document.getElementById('btn-stop');
        const checkboxAudio = document.getElementById('audio-enabled');
        const checkboxGradient = document.getElementById('gradient-colors');
        const checkboxTaper = document.getElementById('taper-width');
        const selectScale = document.getElementById('scale');
        const selectWaveform = document.getElementById('waveform');

        btnLoadPreset.addEventListener('click', () => {
            const preset = lSystemPresets[presetSelect.value];
            if (!preset) return;

            document.getElementById('axiom').value = preset.axiom;
            document.getElementById('iterations').value = preset.iterations;
            document.getElementById('angle').value = preset.angle;

            const rulesText = Object.entries(preset.rules)
                .map(([key, value]) => `${key}=${value}`)
                .join('\n');
            document.getElementById('rules').value = rulesText;

            document.getElementById('iterations-value').textContent = preset.iterations;
            document.getElementById('angle-value').textContent = preset.angle + '°';
            document.getElementById('preset-description').textContent = preset.description;

            generateLSystem();
        });

        sliderIterations.addEventListener('input', (e) => {
            document.getElementById('iterations-value').textContent = e.target.value;
        });

        sliderAngle.addEventListener('input', (e) => {
            document.getElementById('angle-value').textContent = parseFloat(e.target.value).toFixed(1) + '°';
        });

        sliderStrokeWidth.addEventListener('input', (e) => {
            CONFIG.strokeWidth = parseFloat(e.target.value);
            document.getElementById('stroke-width-value').textContent = CONFIG.strokeWidth.toFixed(1);
            drawTree();
        });

        sliderVolume.addEventListener('input', (e) => {
            CONFIG.volume = parseFloat(e.target.value);
            document.getElementById('volume-value').textContent = CONFIG.volume.toFixed(2);
            if (isAudioInitialized) {
                masterGain.gain.value = CONFIG.volume;
            }
        });

        sliderBpm.addEventListener('input', (e) => {
            CONFIG.bpm = parseInt(e.target.value);
            document.getElementById('bpm-value').textContent = CONFIG.bpm;
        });

        checkboxAudio.addEventListener('change', (e) => {
            CONFIG.audioEnabled = e.target.checked;
        });

        checkboxGradient.addEventListener('change', (e) => {
            CONFIG.gradientColors = e.target.checked;
            drawTree();
        });

        checkboxTaper.addEventListener('change', (e) => {
            CONFIG.taperWidth = e.target.checked;
            drawTree();
        });

        selectScale.addEventListener('change', (e) => {
            CONFIG.scale = e.target.value;
        });

        selectWaveform.addEventListener('change', (e) => {
            CONFIG.waveform = e.target.value;
        });

        btnGenerate.addEventListener('click', generateLSystem);

        btnPlay.addEventListener('click', () => {
            if (isPlaying) {
                pausePlayback();
            } else {
                startPlayback();
            }
        });

        btnStop.addEventListener('click', stopPlayback);

        // === INIT ===
        function init() {
            const preset = lSystemPresets.binaryTree;
            document.getElementById('axiom').value = preset.axiom;
            document.getElementById('iterations').value = preset.iterations;
            document.getElementById('angle').value = preset.angle;

            const rulesText = Object.entries(preset.rules)
                .map(([key, value]) => `${key}=${value}`)
                .join('\n');
            document.getElementById('rules').value = rulesText;

            document.getElementById('preset-description').textContent = preset.description;

            generateLSystem();
        }

        init();
    </script>
</body>
</html>
